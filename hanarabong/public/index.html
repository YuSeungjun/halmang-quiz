</div>

<section id="translation-page" aria-labelledby="translation-title" hidden>
  <header class="translation-heading">
    <div>
      <h1 id="translation-title">문장 번역</h1>
      <p>문장을 적거나 추천 문장을 골라, 제주어와 표준어를 나란히 읽어 보세요.</p>
    </div>
    <div class="letter-stamp" aria-hidden="true"><img src="assets/orchard.webp" alt=""></div>
  </header>

  <section class="book-sheet phrasebook" aria-label="양방향 문장 번역">
    <div class="phrase-spread">
      <div class="phrase-page source-page">
        <div class="phrase-label"><label id="source-language" for="source-example">표준어</label>
        </div>
        <textarea id="source-example" class="ruled-text" rows="3" maxlength="300" placeholder="번역할 문장을 적어 주세요." aria-describedby="source-count"></textarea>
        <div class="source-meta"><span id="speech-status" role="status"></span><span id="source-count">0 / 300자</span></div>
      </div>
      <button type="button" id="swap-languages" class="swap-languages" aria-label="번역 방향 바꾸기" title="번역 방향 바꾸기"><svg class="icon" aria-hidden="true"><use href="#swap"/></svg></button>
      <div class="phrase-page target-page">
        <div class="phrase-label"><h2 id="target-language">제주어</h2>
          <button type="button" id="jeju-listen" class="sentence-listen" title="VoxCPM2 · AI Hub + JSS · 목소리 03"><span class="listen-mark" aria-hidden="true"><svg class="icon"><use href="#sound"/></svg></span><span class="listen-label">제주어 듣기</span></button>
        </div>
        <p id="target-example" class="ruled-text" aria-live="polite" aria-atomic="true"></p>
        <p id="result-speech-status" class="source-meta" role="status"></p>
      </div>
    </div>
    <div class="phrasebook-foot">
      <p id="translation-status" role="status"></p>
      <div class="phrase-actions">
        <button id="translation-reset" type="button"><svg class="icon" aria-hidden="true"><use href="#again"/></svg>초기화</button>
        <button class="translation-submit" type="button"><span class="submit-ribbon" aria-hidden="true"></span><span>번역하기</span><span class="submit-percent" aria-hidden="true" hidden></span><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button>
      </div>
      <progress id="translation-progress" class="visually-hidden" max="100" value="0" aria-label="번역 예상 진행률" hidden></progress>
    </div>
    <section id="word-evidence" aria-labelledby="word-evidence-title" hidden>
      <h3 id="word-evidence-title">낱말 출처</h3>
      <ul></ul>
    </section>
  </section>

  <section class="suggestions" aria-labelledby="suggestions-title">

      <button type="button" class="suggestion" aria-pressed="true">
        <span class="suggestion-topic">첫인사</span><strong data-lang="jeju" hidden>혼저 옵서.</strong><strong data-lang="standard">어서 오십시오.</strong>
        <svg class="icon" aria-hidden="true"><use href="#check"/></svg>
      </button>
      <button type="button" class="suggestion" aria-pressed="false">
        <span class="suggestion-topic">길 묻기</span><strong data-lang="jeju" hidden>바당드렌 어떵 갑니까?</strong><strong data-lang="standard">바다에는 어떻게 갑니까?</strong>
        <svg class="icon" aria-hidden="true"><use href="#arrow"/></svg>
      </button>
      <button type="button" class="suggestion" aria-pressed="false">
        <span class="suggestion-topic">밥상에서</span><strong data-lang="jeju" hidden>먹을 것도 촘 하영 있저.</strong><strong data-lang="standard">먹을 것도 참 많이 있네.</strong>
        <svg class="icon" aria-hidden="true"><use href="#arrow"/></svg>
      </button>
    </div>
  </section>
</section>
